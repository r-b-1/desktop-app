name: Beta Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact_glob: Desktop-Chat-*.dmg
          - os: windows-latest
            bundle: nsis
            artifact_glob: src/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Create DMG artifact
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create \
            -volname "Desktop Chat" \
            -srcfolder "src/src-tauri/target/release/bundle/macos/Desktop Chat.app" \
            -ov \
            -format UDZO \
            "Desktop-Chat-${{ github.ref_name }}.dmg"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop Chat ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: ${{ matrix.artifact_glob }}
